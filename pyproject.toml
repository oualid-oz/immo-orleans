[project]
name = "immo-orleans"
version = "0.1.0"
description = "Où acheter autour d’Orléans, pour quel budget (DVF 2021-2025)"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6",
    "openai>=3.52",
    "pandas>=3.1",
    "plotly>=7.1",
    "pyarrow>=26",
    "scikit-learn>=1.9",
    "streamlit>=1.67",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
